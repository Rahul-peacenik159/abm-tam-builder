name: run

# Run on GitHub's servers: Actions tab > "run" > Run workflow.
# Results: table on the run's Summary page + downloadable "results" artifact (CSV/JSONL).
#
# PRIVACY: in a PUBLIC repo, run logs, summaries and artifacts are visible to others.
# Scan public sample lists here; run your real account list in a PRIVATE copy of this repo.

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Preset from config/presets.yaml (used if area/tag are empty)"
        type: string
        default: "hotels-dallas"
      area:
        description: "Or OpenStreetMap area name, e.g. Austin"
        type: string
        default: ""
      tag:
        description: "...with an OSM tag, e.g. amenity=restaurant"
        type: string
        default: ""

  # Weekly run (uses the defaults in the env block). Uncomment to enable.
  # schedule:
  #   - cron: "23 4 * * 1"   # Mondays 04:23 UTC

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRESET: ${{ inputs.preset || 'hotels-dallas' }}
      AREA: ${{ inputs.area }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore previous run (for "what's new")
        uses: actions/cache/restore@v5
        with:
          path: out/snapshots
          key: snapshots-abm-tam-builder-${{ github.run_id }}
          restore-keys: snapshots-abm-tam-builder-

      - name: Run
        run: |
          set -f
          if [ -n "$AREA" ] && [ -n "$TAG" ]; then
            python -m tam_builder build --source osm --area "$AREA" --tag "$TAG" --out out
          else
            python -m tam_builder build --preset "$PRESET" --out out
          fi

      - name: Results table on the Summary page
        if: always()
        run: |
          if [ -d out ]; then python -m tam_builder summary out >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save state for next run
        if: always()
        uses: actions/cache/save@v5
        with:
          path: out/snapshots
          key: snapshots-abm-tam-builder-${{ github.run_id }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: results
          path: |
            out/*.csv
            out/*.md
            out/*.jsonl
            out/*.json
          retention-days: 30
